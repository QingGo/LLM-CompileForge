import lit.formats
import os

config.name = "SfDialect"
config.test_format = lit.formats.ShTest(execute_external=False)
config.suffixes = [".mlir"]

config.test_source_root = os.path.dirname(os.path.abspath(__file__))
config.test_exec_root = config.test_source_root

# Locate sf-opt binary.
_sf_opt_paths = [
    os.path.join(config.test_source_root, "..", "tools", "sf-opt", "sf-opt"),
    os.path.join(config.test_source_root, "..", "build", "tools", "sf-opt"),
    os.path.join(config.test_source_root, "..", "build", "bin"),
]
_sf_opt = "sf-opt"
for p in _sf_opt_paths:
    if os.path.isfile(p):
        _sf_opt = p
        break

config.substitutions.append(("%sf-opt", _sf_opt))

# Check if FileCheck is available on PATH.
_has_filecheck = any(
    os.path.isfile(os.path.join(d, "FileCheck"))
    for d in os.environ.get("PATH", "").split(":")
    if d
) or os.path.isfile("/usr/local/opt/llvm/bin/FileCheck")

if _has_filecheck:
    config.available_features.add("filecheck")
