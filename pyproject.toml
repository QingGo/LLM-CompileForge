[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python_runtime", "compiler", "kernels"]

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "llm-serveforge"
version = "0.1.0-dev"
description = "Hardware-agnostic LLM inference compilation and runtime"
requires-python = "==3.10.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pyyaml>=6",
    "numpy>=1.26",
    "torch @ https://github.com/QingGo/pytorch/releases/download/torch-2.9.1-macos15-py3.10-accelerate/torch-2.9.1a0+gitd38164a-cp310-cp310-macosx_10_15_x86_64.whl",
    "maturin>=1.13.3",
    "nanobind>=2.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-timeout>=2",
    "pytest-cov>=5",
    "httpx>=0.28",
    "psutil>=6",
]
compile = [
    "transformers>=4.50",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "compiler/state_export.py"]

[tool.pytest.ini_options]
testpaths = ["tests", "python_runtime/engine/tests", "python_runtime/hal/tests", "compiler/tests"]
# Default per-test timeout.  Was 1s — too aggressive: it killed legitimate
# tests that invoke subprocesses (mlir-translate/llc ~2-60s) and produced
# flaky Timeout failures under load.  30s still catches accidental hangs
# while letting real subprocess-based unit tests finish; genuinely slow
# tests set their own @pytest.mark.timeout.
timeout = 30
timeout_method = "signal"
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "unit: fast unit test (<1s)",
    "integration: integration test (may use real I/O)",
    "smoke: minimal smoke test",
    "baseline: model-output cosine regression test (>0.999 vs HF)",
    "benchmark: performance benchmark test",
    "slow: slow test, excluded from quick runs",
]

[tool.coverage.run]
source = ["python_runtime", "compiler", "kernels"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 65
exclude_also = [
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

