[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hal", "compiler", "engine", "server"]

[project]
name = "llm-serveforge"
version = "0.1.0-dev"
description = "Hardware-agnostic LLM inference compilation and runtime"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pyyaml>=6",
    "numpy>=1.26",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.4",
]
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "psutil>=6",
    "httpx>=0.28",
    "torch>=2.4",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 1
timeout_method = "signal"
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "unit: fast unit test (<1s)",
    "integration: integration test (may use real I/O)",
    "smoke: minimal smoke test",
    "baseline: model-output cosine regression test (>0.999 vs HF)",
    "benchmark: performance benchmark test",
]
