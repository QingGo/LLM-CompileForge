syntax = "proto3";

package sfa;

// Top-level ABI header embedded in compiled dylib as "sfa_abi" symbol.
// Contains function metadata and input field bindings for all ciface wrappers.
message SfaAbiHeader {
  uint32 magic = 1;     // 0x41464253 ("SFBA" LE) — sentinel to verify protobuf format
  uint32 version = 2;   // 1
  repeated SfaFuncMeta funcs = 3;
}

// Metadata for a single ciface function wrapper (e.g. _mlir_ciface_main_0).
message SfaFuncMeta {
  string symbol = 1;            // "_mlir_ciface_main_0"
  uint32 num_inputs = 2;        // total number of ptr arguments (incl. sret)
  uint32 output_rank = 3;       // packed output memref rank (0-4) — max rank across all outputs
  repeated SfaInputField input_fields = 4;
  repeated OutputDescriptor outputs = 5;  // per-output descriptor (rank + dims)
}

// Describes a single output tensor from a ciface function.
message OutputDescriptor {
  uint32 rank = 1;
  repeated uint64 dims = 2;     // 0 = dynamic dimension
  bool consumed_internally = 3; // true = output consumed by KV cache (not exposed as SSA)
}

// Describes the kind and binding of each function input argument.
// Per-input rank and dimensions tell the runtime what shape MemRef
// descriptor to construct for this argument, critical for correctly
// passing sub-views of packed output buffers to the dylib.
message SfaInputField {
  SfaInputKind kind = 1;
  oneof binding {
    string weight_name = 2;     // SFA_INPUT_WEIGHT — compiled weight/constant name
    SfaSsaRef ssa = 3;          // SFA_INPUT_SSA — reference to producer function output
  }
  uint32 rank = 5;              // tensor rank of this input (1-4)
  repeated uint64 dims = 6;     // tensor dimensions (0 = dynamic / unknown at compile time)
}

// Discriminated input source: global (model input), weight (compiled weight),
// or SSA (dataflow edge from another function).
enum SfaInputKind {
  SFA_INPUT_GLOBAL = 0;
  SFA_INPUT_WEIGHT = 1;
  SFA_INPUT_SSA = 2;
}

// Reference to a producer function's output for SSA dataflow edges.
message SfaSsaRef {
  uint32 producer_func = 1;  // index into SfaAbiHeader.funcs
  uint32 producer_out = 2;   // output index of the producer function
}

// Weight data embedded in compiled dylib as "sfa_weights" symbol.
// Contains weight name mapping (compiled_name → safetensors key) and
// embedded constant tensors (compiler-synthesized, e.g. attention masks).
message SfaWeightData {
  repeated SfaWeightEntry weight_entries = 1;
  repeated SfaConstant constant_entries = 2;
}

// Maps a compiled weight name to its HuggingFace safetensors key.
message SfaWeightEntry {
  string compiled_name = 1;  // e.g. "wte_weight"
  string hf_key = 2;         // e.g. "model.decoder.embed_tokens.weight"
}

// An embedded constant tensor (compiler-synthesized, not from model weights).
message SfaConstant {
  string name = 1;            // e.g. "_const_causal_mask"
  uint32 dtype_code = 2;      // 0=f32, 1=f16, 2=bf16, 3=i64, 4=i32, 5=i8, 6=u8
  repeated uint64 shape = 3;  // tensor dimensions
  bytes data = 4;             // raw element bytes
}

// ── Execution Plan (field numbers 20-29) ──────────────────────────
// Declares the sequential function call graph for multi-function modules.
// Produced by the Python compiler (split.py), consumed by the C++ chain
// wrapper pass (SfChainWrapper.cpp) and Path B Rust runtime.
//
// Separates concerns: the producer (Python) knows the correct ordering
// and dataflow edges; the consumer (C++/Rust) reads the plan without
// deriving it from naming conventions or string sorting.

message ExecutionPlan {
  // Global input arg names for the combined entry point (main()).
  // In order: [input_ids, weight_1, weight_2, ...].
  // Corresponds to sf.weight_names on main_0 after weight promotion.
  repeated string global_inputs = 20;

  // Sequential execution steps. Index 0 runs first, then 1, etc.
  repeated ExecutionStep steps = 21;
}

message ExecutionStep {
  string func_name = 1;

  // One EdgeInput per function argument, in func arg order.
  // Arg 0 is always the hidden state (STEP_OUTPUT from previous step,
  // or GLOBAL_INPUT for main_0's input_ids).
  repeated EdgeInput inputs = 2;
}

message EdgeInput {
  EdgeSource source = 1;
  uint32 source_index = 2;
  // GLOBAL_INPUT: index into ExecutionPlan.global_inputs
  // STEP_OUTPUT:   output index of the referenced step (0-based)
  //   The step is always the step at source_index_offset below current,
  //   OR an earlier step explicitly referenced when a later function
  //   consumes main_0 outputs directly (e.g., final_norm weights).
  uint32 producer_step = 3;  // only meaningful for STEP_OUTPUT
}

enum EdgeSource {
  GLOBAL_INPUT = 0;
  STEP_OUTPUT = 1;
}

// ── Cache policy types (field numbers 200+) ───────────────────────

// Describes one contiguous cache storage region.
// Mirrors compiler/cache_policy.py::_SlabSpec and runtime/src/kv_cache.rs::SlabSpec.
// dims dict is flattened into explicit fields for type safety.
message SfaSlabSpec {
  string name = 200;         // logical name, e.g. "k", "v", "state" (Python: slab_id)
  string slab_type = 201;    // storage scheme — "paged" | "flat" | "circular" | "fixed" (Python: storage)
  string layout = 202;       // tensor dim order, e.g. "BNLD", "RLD"
  string dtype = 203;        // element type, e.g. "float32", "bfloat16"
  uint32 num_blocks = 204;   // number of blocks allocated (0 = computed at runtime)
  uint32 block_size = 205;   // tokens per block (propagated from CachePolicy.block_size)
  uint32 num_layers = 206;   // dims.layers — number of transformer layers
  uint32 num_heads = 207;    // dims.heads — number of KV attention heads
  uint32 head_dim = 208;     // dims.dim — dimension per head
}

// Describes when and how the executor intercepts an op for cache I/O.
// Mirrors compiler/cache_policy.py::_InterceptSpec and runtime/src/kv_cache.rs::InterceptSpec.
message SfaInterceptSpec {
  string slab_id = 210;             // which slab to read from / write to
  string op_name_pattern = 211;     // short op name, e.g. "scaled_dot_product_attention" (Python: op_name)
  string intercept_type = 212;      // "read" | "write" | "read_write" (Python: direction)
  string source = 213;              // how to extract data, e.g. "operand[1]" | "output"
  string layer = 214;               // layer indexing: "sequential" or static index
  repeated uint32 param_indices = 215; // parsed operand/output indices from source
}

// Declarative model cache strategy — serialized at compile time.
// Mirrors compiler/cache_policy.py::CachePolicy and runtime/src/kv_cache.rs::CachePolicy.
message SfaCachePolicy {
  repeated SfaSlabSpec slabs = 220;
  repeated SfaInterceptSpec intercepts = 221;
  uint32 block_size = 222;      // default block size for paged slabs
  uint32 max_requests = 223;    // pool capacity for fixed-size slabs
}

// ---------------------------------------------------------------------------
// MLIR artifact schema — serializable representation of a compiled MLIR module.
// These messages mirror the compiler/mlir_dialect/mlir_op_types.py dataclasses:
//   MlirOp → SfaMlirOp, MlirFunction → SfaMlirFunction, MlirModule → SfaMlirArtifact.
// Field numbers start at 100 to avoid collisions with core ABI messages (1-10).
// ---------------------------------------------------------------------------

// Top-level MLIR artifact: a module containing functions and metadata.
message SfaMlirArtifact {
  repeated SfaMlirFunction functions = 100;
  map<string, string> metadata = 101;
}

// A parsed MLIR function (func.func) with its operations, I/O, and weights.
message SfaMlirFunction {
  string name = 100;
  repeated SfaMlirOp ops = 101;
  repeated string input_names = 102;   // SSA names of function inputs
  repeated string output_names = 103;  // SSA names of function outputs
  repeated SfaWeightEntry weights = 104;
}

// A single MLIR operation within a function.
message SfaMlirOp {
  string op_type = 100;             // full qualified name: "sf.linear", "arith.addf", etc.
  map<string, string> attributes = 101;
  repeated string inputs = 102;     // SSA names of operands
  repeated string outputs = 103;    // SSA names of results
}

// ── Op Catalog (field numbers 300+) ─────────────────────────────
// Single source of truth for all HAL operators shared across
// compiler / sf-dialect / runtime. Derived from compiler/mlir_dialect/_op_defs.py
// and sf-dialect/include/Sf/SfOps.td.

// Describes a parameter (input) of an operator.
message SfaOpParam {
  string name = 1;     // parameter name, e.g. "input", "weight", "dim"
  string dtype = 2;    // element type: "float32", "float16", "int64", etc.
  uint32 rank = 3;     // 0=scalar, 1-4=tensor rank
}

// Describes a single HAL operator.
message SfaOpDef {
  string name = 300;                    // canonical op name: "linear", "add", etc.
  string kind = 301;                    // category: matmul|element_wise|reduce|attention|normalization|reshape|compare|gather|fill|shape|slice|softmax
  repeated SfaOpParam params = 302;     // input parameter descriptors
  repeated string output_dtypes = 303;  // output element types
}

// Catalog of all HAL operators known to the system.
message SfaOpCatalog {
  repeated SfaOpDef ops = 310;
}


