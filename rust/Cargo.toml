[package]
name = "llm-serveforge-runtime"
version = "0.1.0"
edition = "2021"
description = "Core scheduler and block manager for LLM-ServeForge, implemented in Rust"
default-run = "serveforge"

[lib]
name = "llm_serveforge_runtime"
crate-type = ["cdylib"]

[[bin]]
name = "serveforge"
path = "src/main.rs"

[[bin]]
name = "forward_check"
path = "src/bin/forward_check.rs"

[[bin]]
name = "dump_weights"
path = "src/bin/dump_weights.rs"

[[bin]]
name = "forward_check_hal"
path = "src/bin/forward_check_hal.rs"
# Requires --features hal-rust to access HalRustExecutable

[features]
default = ["cli"]
cli = ["clap", "tokenizers", "rand", "minijinja"]
python-bindings = ["pyo3/extension-module"]
hal-rust = ["rayon"]

[dependencies]
log = "0.4"
env_logger = "0.11"
pyo3 = { version = "0.24", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
libloading = "0.8"
memmap2 = "0.9"
safetensors = "0.6"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", optional = true }
tokenizers = { version = "0.21", optional = true }
minijinja = { version = "2", features = ["macros"], optional = true }
thiserror = "2"
libffi = "5.1.0"
half = "2"
rayon = { version = "1", optional = true }
libc = "0.2"
csv = "1.3"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"
tokio-stream = "0.1"

[dev-dependencies]
proptest = "1"

[profile.release]
lto = true
codegen-units = 1

[lints.clippy]
# Allow common patterns in generated code
manual_is_multiple_of = "allow"
excessive_precision = "allow"
get_first = "allow"
len_zero = "allow"
manual_memcpy = "allow"
needless_range_loop = "allow"

[build-dependencies]
cc = "1.2.62"

[target.x86_64-apple-darwin]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]