[package]
name = "llm-serveforge-runtime"
version = "0.1.0"
edition = "2021"
description = "Core scheduler and block manager for LLM-ServeForge, implemented in Rust"
default-run = "serveforge"

[lib]
name = "llm_serveforge_runtime"
crate-type = ["cdylib"]

[[bin]]
name = "serveforge"
path = "src/main.rs"

[features]
default = ["cli"]
cli = ["clap", "tokenizers", "rand", "minijinja"]
python-bindings = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.24", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
libloading = "0.8"
memmap2 = "0.9"
safetensors = "0.6"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", optional = true }
tokenizers = { version = "0.21", optional = true }
minijinja = { version = "2", features = ["macros"], optional = true }
thiserror = "2"
libffi = "5.1.0"

[profile.release]
lto = true
codegen-units = 1

[build-dependencies]
cc = "1.2.62"
