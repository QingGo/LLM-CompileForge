name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check hal/ compiler/ engine/ server/ tests/

      - name: Lint (mypy)
        run: mypy hal/ compiler/ engine/ server/ --config-file pyproject.toml

      - name: Unit tests with coverage
        run: pytest tests/ -m unit -v --tb=short --timeout=1 --cov=hal --cov=compiler --cov=engine --cov=cache --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
