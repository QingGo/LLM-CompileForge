# configs/tiny_llama.yaml — tiny-random-LlamaForCausalLM configuration
model:
  name: "hf-internal-testing/tiny-random-LlamaForCausalLM"
  architecture: "llama"
  dtype: "float32"
  num_layers: 2
  num_heads: 4
  num_kv_heads: 4
  head_dim: 4
  hidden_size: 16
  intermediate_size: 64
  vocab_size: 32000
  max_position_embeddings: 2048
  rms_norm_eps: 1.0e-05
  rope_theta: 10000.0

compilation:
  backend: "custom_ir"
  optimization_level: 3
  enable_fusion: true
  enable_cse: true
  enable_constant_fold: true
  output_dir: "./compiled/tiny_llama"

runtime:
  max_batch_size: 4
  block_size: 16
  max_blocks: 100
  chunk_size: 128
  max_tokens_per_step: 256
