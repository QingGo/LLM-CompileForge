# configs/llama_1b.yaml — Llama-3.2-1B model configuration
model:
  name: "meta-llama/Llama-3.2-1B"
  architecture: "llama"
  dtype: "bfloat16"
  num_layers: 16
  num_heads: 32
  num_kv_heads: 8
  head_dim: 64
  hidden_size: 2048
  intermediate_size: 8192
  vocab_size: 128256
  max_position_embeddings: 131072
  rms_norm_eps: 1.0e-05
  rope_theta: 500000.0

compilation:
  backend: "mlir"
  optimization_level: 3
  enable_fusion: true
  enable_cse: true
  enable_constant_fold: true
  output_dir: "./compiled/llama_1b"

runtime:
  max_batch_size: 4
  block_size: 16
  max_blocks: 2000
  chunk_size: 128
  max_tokens_per_step: 256
