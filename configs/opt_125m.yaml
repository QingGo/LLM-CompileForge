# configs/opt_125m.yaml — Facebook OPT-125M model configuration
model:
  name: "facebook/opt-125m"
  architecture: "opt"
  dtype: "float16"
  num_layers: 12
  num_heads: 12
  num_kv_heads: 12
  head_dim: 64
  hidden_size: 768
  intermediate_size: 3072
  vocab_size: 50272
  max_position_embeddings: 2048
  layer_norm_eps: 1.0e-05
  activation: "relu"

compilation:
  backend: "custom_ir"
  optimization_level: 3
  enable_fusion: true
  enable_cse: true
  enable_constant_fold: true
  output_dir: "./compiled/opt_125m"

runtime:
  max_batch_size: 8
  block_size: 16
  max_blocks: 500
  chunk_size: 256
  max_tokens_per_step: 512
